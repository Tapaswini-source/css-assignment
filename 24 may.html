<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        .hole{
            height:100vh;
            width: 100%;
            background: rgb(39, 32, 94);
            display: flex;
            flex-wrap: wrap;
        }
        .left{
            height: 100vh;
            width: 50%;
            display: flex;
            flex-direction:column;
            justify-content: center;
            align-items: center;
            gap:40px;
        }
        text{
            height:60%;
            width: 100%;
            background: palevioletred;
        }
        .text h1{
            color: aliceblue;
            font-size: 85px;
        }
        .text p{
            color: rgb(138, 153, 170);
            font-size: 25px;
        }
        .btn{
            height:20% ;
            width:100%;
            display: flex;
            flex-direction: row;
            gap:15px;
        }
        #st{
            color: aliceblue;
            margin-left: 100px;
            height: 40px;
            font-size: 25px;
            width: 120px;
            text-align: center;
            background: rgb(64, 64, 244);
            border-radius: 5px;
        }
        #nd{
            color: aliceblue;
            height:40px;
            width:145px;
            font-size: 25px;
            text-align: center;
            border:2px solid white;
            border-radius: 5px;
        }
        .right{
            height: 100vh;
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .top{
            margin-top: 20px;
            height:50%;
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .bottom{
            margin-bottom: 20px;
            height:50%;
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .one{
            height:100%;
            width: 50%;
            background: rgb(27, 27, 71);
            color: aliceblue;
            border-radius: 20PX;
            margin-left: 20PX;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .two{
            height:100%;
            width: 50%;
            background: rgb(27,27,71);
            color: aliceblue;
            border-radius: 20PX;
            margin-right: 20PX;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .four{
            height:100%;
            width: 50%;
            background: rgb(79, 79, 243);
            color: aliceblue;
            border-radius: 20PX;
            margin-right: 20PX;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width:992px){
            .hole{
                padding:50px;
            }
            .left h1{
                font-size:50px;
            }
            #box{
                flex-direction: column;
            }
        }
        @media(max-width:768px){
            .hole{
                flex-direction: column;
                text-align: center;
                padding: 40px 20px ;
            }
        }
    </style> 
</head>
<body>
    <div class="hole">
        <div class="left">
            <div class="text">
            <h1>Learn <br>Responsive<br>Web Design</h1>
            <p>This Section automatically changes layout on mobile,tablet<br>
                and desktop using flesxbox ,flexwrap and media queries</p></div>
                <div class="btn">
                    <botton id="st">Explore</botton>
                    <botton id="nd">Learn more</botton>
                </div>
        </div>
        <div class="right">
            <div class="top" id="box">
                <div class="one"><h1>HTML</h1></div>
                <div class="two"><h1>CSS</h1></div>
            </div>
            <div class="bottom" id="box">
                <div class="one"><h1>Flexbox</h1></div>
                <div class="four"><h1>Media query</h1></div>
            </div>
        </div>
    </div>
</body>
</html>
